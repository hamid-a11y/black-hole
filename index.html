<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; right: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 10px 12px; max-width: calc(100vw - 48px); color: #fffc; font: 12px system-ui, sans-serif; background: #0008; padding: 6px 10px; border-radius: 8px; }
  #ui select, #ui input { vertical-align: middle; }
  #hint { position: fixed; left: 16px; bottom: 12px; color: #fff8; font: 12px system-ui, sans-serif; pointer-events: none; }
</style>
</head>
<body>
<div id="hint">Drag to orbit, scroll to zoom</div>
<div id="ui">
  <label>Disk <input id="bright" type="range" min="0.3" max="2" step="0.05" value="1"></label>
  <label>Bloom <input id="bloom" type="range" min="0" max="2" step="0.05" value="0.35"></label>
  <label><input id="kerr" type="checkbox"> Kerr</label>
  <label>Spin <input id="spin" type="range" min="0.05" max="0.99" step="0.01" value="0.9" disabled></label>
  <label>Quality <select id="quality"><option value="0.5">Low</option><option value="1" selected>Medium</option><option value="1.5">High</option></select></label>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const ortho = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const vert = `void main(){ gl_Position = vec4(position.xy, 0.0, 1.0); }`;

// Units: Schwarzschild radius rs = 1. Light rays follow null geodesics,
// integrated with the Binet-form acceleration a = -1.5 * h^2 * x / r^5.
const frag = `
precision highp float;
uniform vec2  uRes;
uniform vec3  uCam;
uniform mat3  uRot;
uniform float uTime;
uniform float uBright;

uniform float uSpin;  // dimensionless spin a/M, 0 = Schwarzschild
uniform float uRh;    // horizon radius (rs units)
uniform float uRin;   // innermost stable circular orbit (rs units)
const float ROUT = 13.0;

float hash(vec2 p){ p = fract(p*vec2(123.34, 456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float hash3(vec3 p){ p = fract(p*0.3183099 + .1); p *= 17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f*f*(3.0-2.0*f);
  return mix(mix(hash(i), hash(i+vec2(1,0)), f.x), mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p*=2.03; a*=.5; } return s; }

vec3 blackbody(float t){ // t in 0..1, hot -> white-blue, cool -> deep orange
  vec3 c = mix(vec3(0.55,0.08,0.01), vec3(1.0,0.45,0.1), smoothstep(0.0,0.4,t));
  c = mix(c, vec3(1.0,0.85,0.6), smoothstep(0.35,0.8,t));
  return mix(c, vec3(0.8,0.9,1.0), smoothstep(0.8,1.2,t));
}

vec3 stars(vec3 d){
  vec3 col = vec3(0.0);
  for(int l=0;l<3;l++){
    float sc = 90.0 + float(l)*110.0;
    vec3 g = d*sc, id = floor(g);
    float h = hash3(id + float(l)*17.0);
    if(h > 0.965){
      vec3 c = fract(g) - 0.5;
      float m = smoothstep(0.35, 0.0, length(c));
      vec3 tint = mix(vec3(1.0,0.75,0.55), vec3(0.65,0.8,1.0), hash3(id+3.1));
      col += tint * m * (0.4 + 1.6*hash3(id+9.7));
    }
  }
  // faint milky-way band
  float band = exp(-pow(d.y*3.0 + 0.3*sin(d.x*2.0), 2.0));
  col += vec3(0.02,0.018,0.03) * band * (0.4 + fbm(d.xz*6.0+d.y*4.0));
  return col;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5*uRes) / uRes.y;
  vec3 dir = normalize(uRot * vec3(uv, -1.4));
  vec3 pos = uCam, vel = dir;
  vec3 hv = cross(pos, vel);
  float h2 = dot(hv, hv);

  vec3 col = vec3(0.0);
  float trans = 1.0;
  float glow = 0.0;
  bool captured = false;

  for(int i=0;i<420;i++){
    float r2 = dot(pos,pos), r = sqrt(r2);
    if(r < uRh){ captured = true; break; }
    if(r > 80.0 && dot(pos,vel) > 0.0) break;

    float dt = clamp(0.04*(r-0.7), 0.012, 1.2);
    // photon-ring glow (light grazing r = 1.5)
    glow += exp(-abs(r-1.5)*5.0) * dt * 0.12;

    vec3 prev = pos;
    // Schwarzschild bending + gravitomagnetic (Lense-Thirring) frame dragging
    vec3 J  = vec3(0.0, uSpin*0.25, 0.0);
    vec3 rh = pos/r;
    vec3 Bg = (3.0*rh*dot(rh,J) - J)/(r2*r);
    vel += (-1.5*h2*pos/(r2*r2*r) + 4.0*cross(vel, Bg)) * dt;
    vel = normalize(vel);
    pos += vel*dt;

    // accretion disk crossing the equatorial plane (y = 0)
    if(prev.y*pos.y < 0.0){
      float t = prev.y/(prev.y-pos.y);
      vec3 p = mix(prev, pos, t);
      float rr = length(p.xz);
      if(rr > uRin && rr < ROUT){
        float phi = atan(p.z, p.x);
        float omega = 3.2 / (rr*sqrt(rr));        // Keplerian shear
        float a = phi + uTime*omega;
        float n = fbm(vec2(rr*1.6, a*3.0 + rr*0.6));
        float rings = 0.65 + 0.35*sin(rr*7.0 + n*5.0);
        float dens = (0.35 + 0.9*n) * rings;
        dens *= smoothstep(uRin, uRin+0.8, rr) * (1.0 - smoothstep(ROUT-4.0, ROUT, rr));

        float temp = pow(uRin/rr, 0.75) * 1.15;
        // relativistic Doppler + beaming
        float vorb = sqrt(0.5/(rr-0.0)) ;                 // v/c ~ sqrt(rs/2r)
        vec3 vdir  = normalize(vec3(-p.z, 0.0, p.x));
        float beta = dot(vdir, -vel) * vorb;
        float D = 1.0/(1.0 - beta);
        float I = dens * pow(D, 3.0) * (0.6 + 2.2*pow(uRin/rr, 1.5));
        vec3 c = blackbody(temp*D) * I;
        float a_ = clamp(dens*0.9, 0.0, 0.95);
        col += trans * c * a_;
        trans *= (1.0 - a_*0.85);
      }
    }
    if(trans < 0.02) break;
  }

  if(!captured) col += trans * stars(normalize(vel)) * 1.2;
  if(!captured) col += vec3(1.0,0.75,0.5) * glow * trans * 0.35;
  col *= uBright;

  // tonemap + gamma + subtle vignette
  col = 1.0 - exp(-col*1.3);
  col = pow(col, vec3(1.0/2.2));
  col *= 1.0 - 0.35*dot(uv,uv);
  gl_FragColor = vec4(col, 1.0);
}`;

const uniforms = {
  uRes:  { value: new THREE.Vector2() },
  uCam:  { value: new THREE.Vector3() },
  uRot:  { value: new THREE.Matrix3() },
  uTime: { value: 0 },
  uBright: { value: 1 },
  uSpin: { value: 0 },
  uRh:   { value: 1 },
  uRin:  { value: 3 },
};

// Kerr parameters (G = c = 1, M = rs/2): outer horizon and prograde ISCO
function updateKerr(){
  const a = document.getElementById('kerr').checked ? +document.getElementById('spin').value : 0;
  const cb = Math.cbrt;
  const z1 = 1 + cb(1 - a*a) * (cb(1 + a) + cb(1 - a));
  const z2 = Math.sqrt(3*a*a + z1*z1);
  const iscoM = 3 + z2 - Math.sqrt((3 - z1) * (3 + z1 + 2*z2));
  uniforms.uSpin.value = a;
  uniforms.uRh.value   = 0.5 * (1 + Math.sqrt(1 - a*a));
  uniforms.uRin.value  = iscoM / 2;
  document.getElementById('spin').disabled = !document.getElementById('kerr').checked;
}

let pr = 1;
document.getElementById('ui').addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'bright') uniforms.uBright.value = +e.target.value;
  if (id === 'bloom') { bloomPass.strength = +e.target.value; bloomPass.enabled = +e.target.value > 0; }
  if (id === 'kerr' || id === 'spin') updateKerr();
  if (id === 'quality') { pr = +e.target.value; renderer.setPixelRatio(pr); composer.setPixelRatio(pr); resize(); }
});
scene.add(new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({ vertexShader: vert, fragmentShader: frag, uniforms, depthTest: false })
));

// Post-processing: bloom
const composer = new THREE.EffectComposer(renderer);
composer.addPass(new THREE.RenderPass(scene, ortho));
const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.75);
composer.addPass(bloomPass);

// Orbit controls (manual)
let yaw = 0.6, pitch = 0.12, dist = 28, drag = false, lx = 0, ly = 0;
addEventListener('pointerdown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup',   () => drag = false);
addEventListener('pointermove', e => {
  if (!drag) return;
  yaw   -= (e.clientX - lx) * 0.005;
  pitch  = Math.max(-1.4, Math.min(1.4, pitch + (e.clientY - ly) * 0.005));
  lx = e.clientX; ly = e.clientY;
});
addEventListener('wheel', e => { dist = Math.max(4, Math.min(80, dist * Math.exp(e.deltaY * 0.001))); }, { passive: true });

function resize(){
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  const s = renderer.getPixelRatio();
  uniforms.uRes.value.set(innerWidth*s, innerHeight*s);
}
addEventListener('resize', resize); resize(); updateKerr();

const cam = new THREE.PerspectiveCamera(); // camera lookAt uses -Z, which the shader expects
const clock = new THREE.Clock();
(function loop(){
  if (!drag) yaw += 0.0007;
  cam.position.set(
    dist*Math.cos(pitch)*Math.sin(yaw),
    dist*Math.sin(pitch),
    dist*Math.cos(pitch)*Math.cos(yaw));
  cam.lookAt(0, 0, 0);
  cam.updateMatrixWorld();
  uniforms.uCam.value.copy(cam.position);
  uniforms.uRot.value.setFromMatrix4(cam.matrixWorld);
  uniforms.uTime.value = clock.getElapsedTime();
  composer.render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
